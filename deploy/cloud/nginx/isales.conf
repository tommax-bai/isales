# /etc/nginx/sites-available/isales — cloud-edge topology
#
# Three listeners:
#   443  HTTPS  → isales-web/dist (SPA) + /api → isales-api :8000
#   50051 gRPC  → isales-engine cloud-edge bidi stream
#                 (TLS termination at nginx; bearer token validated by engine)
#   80   HTTP   → 301 to HTTPS
#
# Cert source: Let's Encrypt via certbot (see RUNBOOK-cloud.md §TLS).
# Hostname placeholder __ISALES_DOMAIN__ rewritten by install.sh.

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name __ISALES_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS: web + api ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __ISALES_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__ISALES_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__ISALES_DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # isales-web SPA — vite build output, atomic-swap follows /opt/isales/current
    root /var/www/isales-web;
    index index.html;

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }

    # WebSocket for isales-api (real-time UI updates)
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- HTTPS: cloud-edge gRPC bidi ----------
# Separate listener so edge devices use a distinct SNI/port without colliding
# with the browser-facing 443. nginx terminates TLS; bearer token (gRPC
# metadata `authorization: Bearer <EDGE_DEVICE_TOKEN>`) is validated by engine.
server {
    listen 50051 ssl http2;
    listen [::]:50051 ssl http2;
    server_name __ISALES_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__ISALES_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__ISALES_DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # gRPC bidi stream — long-lived; keep timeouts generous for the 30 s heartbeat.
    grpc_read_timeout  3600s;
    grpc_send_timeout  3600s;

    location / {
        grpc_pass grpc://127.0.0.1:50051;
        # Hand the edge identity (mTLS-style) to engine via bearer in metadata;
        # nginx need not inspect, only forward.
        error_page 502 = /grpc-unavailable;
    }

    location = /grpc-unavailable {
        internal;
        default_type application/grpc;
        add_header grpc-status 14;        # UNAVAILABLE
        add_header grpc-message "engine unavailable";
        return 204;
    }
}
